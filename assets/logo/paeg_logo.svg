<?xml version="1.0" encoding="UTF-8"?>
<!-- PAEG Logo v1: 根(扎根) + 芽(成长) + 光点(注意力) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2A52"/>
      <stop offset="100%" stop-color="#1A3A6B"/>
    </linearGradient>
  </defs>

  <!-- 背景（米白） -->
  <rect x="0" y="0" width="1024" height="1024" fill="#F5F2EC"/>

  <!-- 深蓝圆环（象征完整/守护/共同体） -->
  <circle cx="512" cy="470" r="300" fill="none" stroke="#0F2A52" stroke-width="22" opacity="0.15"/>
  <circle cx="512" cy="470" r="250" fill="none" stroke="#0F2A52" stroke-width="8" opacity="0.25"/>

  <!-- 根部：向下延伸的三道弧形根须（扎根） -->
  <path d="M 400 560 Q 360 640 340 720" fill="none" stroke="#0F2A52" stroke-width="20" stroke-linecap="round"/>
  <path d="M 512 590 Q 512 670 512 750" fill="none" stroke="#0F2A52" stroke-width="22" stroke-linecap="round"/>
  <path d="M 624 560 Q 664 640 684 720" fill="none" stroke="#0F2A52" stroke-width="20" stroke-linecap="round"/>

  <!-- 根部须分支（细节） -->
  <path d="M 360 650 Q 330 680 320 700" fill="none" stroke="#0F2A52" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 664 650 Q 694 680 704 700" fill="none" stroke="#0F2A52" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- 茎部：流畅上升弧线（成长/教育是等待） -->
  <path d="M 420 560 Q 470 400 512 300 Q 554 400 604 560" fill="none" stroke="#0F2A52" stroke-width="24" stroke-linecap="round"/>

  <!-- 幼芽：芽尖两片小叶 -->
  <path d="M 512 300 Q 512 250 480 230 Q 500 240 512 260" fill="#0F2A52" stroke-linecap="round"/>
  <path d="M 512 300 Q 512 250 544 230 Q 524 240 512 260" fill="#1A3A6B" stroke-linecap="round"/>

  <!-- 光点：注意力之金（唯一强调色） -->
  <circle cx="512" cy="250" r="18" fill="#E6A528"/>
  <circle cx="512" cy="250" r="30" fill="#E6A528" opacity="0.25"/>
  <circle cx="512" cy="250" r="46" fill="#E6A528" opacity="0.10"/>

  <!-- 底部文字 PAEG -->
  <text x="512" y="870" font-family="Microsoft YaHei, Arial, sans-serif" font-size="88"
        font-weight="bold" fill="#0F2A52" text-anchor="middle" letter-spacing="12">PAEG</text>
  <text x="512" y="930" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30"
        fill="#555F6B" text-anchor="middle" letter-spacing="6">Pedagogical Agent with Evolving Growth</text>
</svg>
