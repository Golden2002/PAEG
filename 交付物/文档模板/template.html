<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{DOC_TITLE}}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================================
       封面 (Cover) — 首页 · 无页眉页脚
       ============================================================
       【模板占位符】(渲染时替换)
         {{DOC_TITLE}}        页眉文档标题
         {{BRAND_TEXT}}       顶部品牌条 (默认: EDUCATION · AGENT · WHITEPAPER)
         {{TAGLINE_LINES}}    副标语 (HTML 多行, 用 <br> 分行)
         {{TITLE_LINE_1}}     主标题第 1 行
         {{TITLE_LINE_2}}     主标题第 2 行 (会带青色下划线)
         {{SUBTITLE}}         主标题下的副说明段
         {{FEATURES}}         4 卡亮点 (见下方示例结构)
         {{META_ITEMS}}       元信息卡 (默认 4 列: Version/Document/Date/Status)
         {{FOOTER_LEFT}}      底部署名 (默认: EDU · AGENT)
         {{FOOTER_RIGHT}}     底部保密声明
       ============================================================ -->
  <section class="cover">

    <!-- 右侧视觉锚点（同心圆环 + 巨型 01 + 斜向网格 + 节点） -->
    <div class="cover-art" aria-hidden="true">
      <span class="numeral">01</span>
      <span class="node n1"></span>
      <span class="node n2"></span>
      <span class="node n3"></span>
      <span class="node n4"></span>
      <span class="node n5"></span>
    </div>

    <div class="cover-inner">

      <!-- ① 顶部品牌条 -->
      <div class="cover-brand">
        <span class="dot"></span>
        <span>{{BRAND_TEXT}}</span>
      </div>

      <!-- ② 副标语（两行） -->
      <p class="cover-tagline">
        {{TAGLINE_LINES}}
      </p>

      <!-- ③ 中部：主标题 + 副标题 -->
      <div class="cover-title-wrap">
        <div>
          <h1 class="cover-title">
            {{TITLE_LINE_1}}<br>
            <span class="accent">{{TITLE_LINE_2}}</span>
          </h1>
          <p class="cover-sub">{{SUBTITLE}}</p>
        </div>
      </div>

      <!-- ④ 能力亮点（4 卡：data-num 用于右下角描边数字） -->
      <div class="cover-features">
        {{FEATURES}}
      </div>

      <!-- ⑤ 元信息卡（4 列：Version / Document / Date / Status） -->
      <div class="cover-meta">
        {{META_ITEMS}}
      </div>

      <!-- ⑥ 底部署名 + 保密声明 -->
      <div class="cover-footer">
        <span class="seal">{{FOOTER_LEFT}}</span>
        <span>{{FOOTER_RIGHT}}</span>
      </div>

    </div>
  </section>

  <!-- ============================================================
       正文容器
       string-set: doc-title — 注入到 @page 页眉左侧
       ============================================================ -->
  <main class="body" style="string-set: doc-title '{{DOC_TITLE}}';">

    {{CONTENT}}

  </main>

<script src="./mermaid.min.js"></script>
<style>.mermaid{text-align:center;margin:6mm 0} .mermaid svg{max-width:100%} .mermaid img{max-height:170mm;page-break-inside:avoid;margin:8mm auto;display:block;max-width:100%}
/* v0.70 修复：图9/15 深色文字+深色背景不可见——强制 Mermaid SVG 高对比度（浅底深字），
   防止 sequenceDiagram actor/节点使用深色填充时文字不可辨认 */
.mermaid svg, .mermaid svg * { background-color: #ffffff !important; }
.mermaid .actor, .mermaid .actor-top, .mermaid .actor-bottom,
.mermaid .messageText, .mermaid .messageLine0, .mermaid .messageLine1,
.mermaid .labelText, .mermaid .nodeLabel, .mermaid .edgeLabel,
.mermaid text, .mermaid tspan { fill: #1a1a2e !important; color: #1a1a2e !important; }
.mermaid .actor { fill: #f0f4ff !important; stroke: #4a6fa5 !important; }
.mermaid .actor-line { stroke: #4a6fa5 !important; }
.mermaid .sequenceNumber { fill: #ffffff !important; }
.mermaid .noteText, .mermaid .note { fill: #fff8e1 !important; stroke: #b08900 !important; color: #3a3000 !important; }
.mermaid .loopText, .mermaid .label { fill: #1a1a2e !important; }
.mermaid .cluster-label span, .mermaid .cluster-label { fill: #1a1a2e !important; color: #1a1a2e !important; }
.mermaid rect.actor { fill: #f0f4ff !important; }
.mermaid .messageText { fill: #1a1a2e !important; }
.mermaid .activation0 { fill: #e8f0fe !important; stroke: #4a6fa5 !important; }
.mermaid .arrowhead { fill: #4a6fa5 !important; }
.mermaid rect { fill-opacity: 1 !important; }
</style>
<script>try{mermaid.initialize({startOnLoad:false,theme:'base',securityLevel:'loose',
  themeVariables:{
    background:'#ffffff',
    primaryColor:'#f0f4ff',
    primaryTextColor:'#1a1a2e',
    primaryBorderColor:'#4a6fa5',
    secondaryColor:'#e8f0fe',
    secondaryTextColor:'#1a1a2e',
    secondaryBorderColor:'#4a6fa5',
    tertiaryColor:'#fff8e1',
    tertiaryTextColor:'#1a1a2e',
    tertiaryBorderColor:'#b08900',
    lineColor:'#4a6fa5',
    textColor:'#1a1a2e',
    actorBkg:'#f0f4ff',
    actorBorder:'#4a6fa5',
    actorTextColor:'#1a1a2e',
    actorLineColor:'#4a6fa5',
    signalColor:'#4a6fa5',
    signalTextColor:'#1a1a2e',
    noteBkgColor:'#fff8e1',
    noteTextColor:'#3a3000',
    noteBorderColor:'#b08900',
    loopTextColor:'#1a1a2e',
    activationBkgColor:'#e8f0fe',
    activationBorderColor:'#4a6fa5',
    sequenceNumberColor:'#ffffff',
    fontFamily:'Noto Sans SC, sans-serif',
    fontSize:'14px'
  }}); try{mermaid.run({querySelector:'.mermaid'});}catch(e){};}catch(e){}</script>
</body>
</html>
