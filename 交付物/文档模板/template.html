<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{DOC_TITLE}}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================================
       封面 (Cover) — 首页 · 无页眉页脚
       ============================================================
       【模板占位符】(渲染时替换)
         {{DOC_TITLE}}        页眉文档标题
         {{BRAND_TEXT}}       顶部品牌条 (默认: EDUCATION · AGENT · WHITEPAPER)
         {{TAGLINE_LINES}}    副标语 (HTML 多行, 用 <br> 分行)
         {{TITLE_LINE_1}}     主标题第 1 行
         {{TITLE_LINE_2}}     主标题第 2 行 (会带青色下划线)
         {{SUBTITLE}}         主标题下的副说明段
         {{FEATURES}}         4 卡亮点 (见下方示例结构)
         {{META_ITEMS}}       元信息卡 (默认 4 列: Version/Document/Date/Status)
         {{FOOTER_LEFT}}      底部署名 (默认: EDU · AGENT)
         {{FOOTER_RIGHT}}     底部保密声明
       ============================================================ -->
  <section class="cover">

    <!-- 右侧视觉锚点（同心圆环 + 巨型 01 + 斜向网格 + 节点） -->
    <div class="cover-art" aria-hidden="true">
      <span class="numeral">01</span>
      <span class="node n1"></span>
      <span class="node n2"></span>
      <span class="node n3"></span>
      <span class="node n4"></span>
      <span class="node n5"></span>
    </div>

    <div class="cover-inner">

      <!-- ① 顶部品牌条 -->
      <div class="cover-brand">
        <span class="dot"></span>
        <span>{{BRAND_TEXT}}</span>
      </div>

      <!-- ② 副标语（两行） -->
      <p class="cover-tagline">
        {{TAGLINE_LINES}}
      </p>

      <!-- ③ 中部：主标题 + 副标题 -->
      <div class="cover-title-wrap">
        <div>
          <h1 class="cover-title">
            {{TITLE_LINE_1}}<br>
            <span class="accent">{{TITLE_LINE_2}}</span>
          </h1>
          <p class="cover-sub">{{SUBTITLE}}</p>
        </div>
      </div>

      <!-- ④ 能力亮点（4 卡：data-num 用于右下角描边数字） -->
      <div class="cover-features">
        {{FEATURES}}
      </div>

      <!-- ⑤ 元信息卡（4 列：Version / Document / Date / Status） -->
      <div class="cover-meta">
        {{META_ITEMS}}
      </div>

      <!-- ⑥ 底部署名 + 保密声明 -->
      <div class="cover-footer">
        <span class="seal">{{FOOTER_LEFT}}</span>
        <span>{{FOOTER_RIGHT}}</span>
      </div>

    </div>
  </section>

  <!-- ============================================================
       正文容器
       string-set: doc-title — 注入到 @page 页眉左侧
       ============================================================ -->
  <main class="body" style="string-set: doc-title '{{DOC_TITLE}}';">

    {{CONTENT}}

  </main>

<script src="./mermaid.min.js"></script>
<style>
/* ═══════════ v1.1 SVG 矢量直出 · Mermaid 排版（终极版）═══════════
   图由浏览器渲染为 SVG 矢量，直接进 PDF——无需截图/容器/分类。
   关键：figure 间距规范（Verdigris/DigitalOcean 调研）+ 防跨页截断 + svg 自适应 */
.mermaid {
  text-align: center;
  margin: 1.5em 0;               /* 图与段落间距：上下 24px（DigitalOcean 2rem 规范） */
  page-break-inside: avoid;      /* 防跨页截断（librarian 调研关键） */
  break-inside: avoid;
}
.mermaid svg {
  max-width: 100% !important;    /* 覆盖 mermaid 注入的 inline max-width（useMaxWidth 关键） */
  max-height: 240mm !important;  /* v1.1 ⭐ 限高：超高 SVG（stateDiagram 等）防跨页截断——等比缩放 */
  height: auto !important;
  width: auto !important;        /* 宽度自适应（max-width 控制），配合 max-height 等比 */
  display: inline-block;
  object-fit: contain;
}
/* 图后段落紧凑（图与文字衔接，防大片空白） */
.mermaid + p, .mermaid + ul, .mermaid + h3, .mermaid + h4 {
  margin-top: 0.75em !important; /* 12px——Verdigris 规范：图与文字间距 */
}
/* v1.1 ⭐ 去 sequenceDiagram/flowchart 文字白框：edgeLabel/messageText/foreignObject 强制透明 */
.mermaid .edgeLabel, .mermaid .nodeLabel, .mermaid .labelText,
.mermaid .label, .mermaid .messageText, .mermaid .messageText tspan {
  background: transparent !important;
  background-color: transparent !important;
  fill: inherit !important;
}
.mermaid foreignObject div, .mermaid foreignObject span {
  background: transparent !important;
  background-color: transparent !important;
  border: none !important;
}
.mermaid g.node foreignObject div, .mermaid g.cluster foreignObject div {
  background: transparent !important;
}
</style>
<script>
/* v1.1 SVG 直出：base 蓝灰默认 + useMaxWidth（图随版心自适应缩放）
   逐图主题由 markdown 内 %%{init: {theme:'dark'|'base'}}%% 覆盖（官方 directive 支持） */
try {
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'loose',
    theme: 'base',
    themeVariables: {
      fontFamily: '"PingFang SC", "Microsoft YaHei", sans-serif',
      fontSize: '14px',
      primaryColor: '#f0f4f9',
      primaryTextColor: '#0f1f3a',
      primaryBorderColor: '#2b3a55',
      secondaryColor: '#e3ecf5',
      secondaryTextColor: '#0f1f3a',
      secondaryBorderColor: '#475569',
      tertiaryColor: '#d6e2ee',
      tertiaryTextColor: '#0f1f3a',
      tertiaryBorderColor: '#475569',
      lineColor: '#475569',
      textColor: '#0f1f3a',
      mainBkg: '#f0f4f9',
      secondBkg: '#e3ecf5',
      border1: '#2b3a55',
      border2: '#475569',
      clusterBkg: '#eaf1f8',
      clusterBorder: '#2b3a55',
      titleColor: '#0f1f3a',
      background: '#ffffff',
      /* sequenceDiagram 显式配色（README #10 经验） */
      actorBkg: '#f0f4f9',
      actorBorder: '#2b3a55',
      actorTextColor: '#0f1f3a',
      actorLineColor: '#475569',
      signalColor: '#475569',
      signalTextColor: '#0f1f3a',
      noteBkgColor: '#fef3c7',
      noteTextColor: '#78350f',
      noteBorderColor: '#b45309',
      activationBkgColor: '#e3ecf5',
      activationBorderColor: '#2b3a55',
      sequenceNumberColor: '#ffffff',
      edgeLabelBackground: 'transparent'  /* v1.1: 消息文字白底矩形→透明 */
    },
    flowchart: { useMaxWidth: true, htmlLabels: true },
    sequence: { useMaxWidth: true },
    state: { useMaxWidth: true }
  });
  try { mermaid.run({ querySelector: '.mermaid' }); } catch (e) {}
} catch (e) {}
</script>
</body>
</html>
